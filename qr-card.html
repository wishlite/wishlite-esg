<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>多肉人格測驗｜活動印製卡</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --moss: #3d5a3e;
  --moss-dark: #2e4630;
  --sage: #7a9e7e;
  --cream: #f5f0e8;
  --soft: #f9f6f0;
  --gold: #c49a3c;
  --gold-light: #d4b06a;
  --mist: #d4e4d0;
  --ink: #1e2a1e;
  --white: #ffffff;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Noto Sans TC', sans-serif;
  background: #e8e0d0;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  padding: 40px 20px;
  -webkit-font-smoothing: antialiased;
}

.card {
  width: 380px;
  background: var(--white);
  border-radius: 24px;
  padding: 48px 36px 32px;
  box-shadow: 0 30px 80px rgba(61, 90, 62, 0.18);
  text-align: center;
  position: relative;
  overflow: hidden;
}

.card::before, .card::after {
  content: '';
  position: absolute;
  width: 120px;
  height: 120px;
  border-radius: 50%;
  opacity: 0.4;
  pointer-events: none;
}
.card::before {
  top: -40px; left: -40px;
  background: radial-gradient(circle, var(--mist) 0%, transparent 70%);
}
.card::after {
  bottom: -40px; right: -40px;
  background: radial-gradient(circle, var(--cream) 0%, transparent 70%);
}

.brand-label {
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 14px;
  font-weight: 500;
  position: relative;
}

.title {
  font-family: 'Noto Serif TC', serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--moss);
  margin-bottom: 8px;
  letter-spacing: 3px;
  line-height: 1.3;
  position: relative;
}

.subtitle {
  font-size: 13px;
  color: var(--sage);
  margin-bottom: 28px;
  line-height: 1.8;
  letter-spacing: 1px;
  position: relative;
}

.qr-frame {
  width: 240px;
  height: 240px;
  margin: 0 auto 20px;
  padding: 16px;
  background: var(--white);
  border: 2px solid var(--cream);
  border-radius: 16px;
  position: relative;
}
.qr-frame img {
  width: 100%;
  height: 100%;
  display: block;
}
.qr-corner {
  position: absolute;
  width: 16px;
  height: 16px;
  border: 3px solid var(--gold);
}
.qr-corner.tl { top: -2px; left: -2px; border-right: none; border-bottom: none; border-radius: 6px 0 0 0; }
.qr-corner.tr { top: -2px; right: -2px; border-left: none; border-bottom: none; border-radius: 0 6px 0 0; }
.qr-corner.bl { bottom: -2px; left: -2px; border-right: none; border-top: none; border-radius: 0 0 0 6px; }
.qr-corner.br { bottom: -2px; right: -2px; border-left: none; border-top: none; border-radius: 0 0 6px 0; }

.scan-line {
  font-family: 'Noto Serif TC', serif;
  font-size: 18px;
  font-weight: 500;
  color: var(--moss-dark);
  margin-bottom: 4px;
  letter-spacing: 2px;
  position: relative;
}
.scan-sub {
  font-size: 12px;
  color: var(--sage);
  letter-spacing: 1.5px;
  margin-bottom: 28px;
  position: relative;
}

.divider {
  width: 40px;
  height: 2px;
  background: var(--gold);
  margin: 0 auto 18px;
  border-radius: 2px;
  position: relative;
}

.footer-text {
  font-size: 11px;
  color: var(--sage);
  letter-spacing: 2px;
  line-height: 1.8;
  position: relative;
}
.footer-text strong {
  color: var(--moss);
  font-weight: 500;
  letter-spacing: 2.5px;
}

.print-only {
  position: fixed;
  top: 20px;
  right: 20px;
  background: var(--moss);
  color: white;
  padding: 10px 20px;
  border-radius: 20px;
  font-size: 13px;
  cursor: pointer;
  border: none;
  font-family: inherit;
  z-index: 100;
}
.print-only:hover { background: var(--moss-dark); }

@media print {
  body { background: white; padding: 0; }
  .card { box-shadow: none; }
  .print-only { display: none; }
  @page { size: A6; margin: 10mm; }
}
</style>
</head>
