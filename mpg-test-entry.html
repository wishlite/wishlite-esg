<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>內部測試｜金流測試入口</title>
<style>
  body{font-family:'Noto Sans TC',sans-serif;background:#FAF7F0;color:#5C4830;line-height:1.9;
    display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:24px;}
  .card{background:#FFFDF9;border:1px solid rgba(92,72,48,.14);border-radius:18px;padding:36px 30px;
    max-width:440px;width:100%;box-shadow:0 14px 40px rgba(91,74,58,.11);}
  h1{font-size:20px;color:#3D2F1F;margin:0 0 8px;}
  p{font-size:14px;color:#8a7c66;margin:0 0 20px;}
  label{display:block;font-size:14px;margin:14px 0 6px;font-weight:500;}
  input{width:100%;padding:13px 14px;font-size:15px;border:1.5px solid rgba(92,72,48,.2);
    border-radius:10px;box-sizing:border-box;}
  button{width:100%;margin-top:20px;padding:15px;font-size:16px;font-weight:600;color:#fff;
    background:#5C4830;border:none;border-radius:12px;cursor:pointer;}
  button:hover{background:#3D2F1F;}
  .warn{margin-top:16px;font-size:12.5px;color:#b08968;line-height:1.8;}
</style>
</head>
<body>
  <div class="card">
    <h1>🔧 內部金流測試（L1・NT$3,980）</h1>
    <p>此頁僅供 Wishlite 團隊測試付款流程，非對外販售頁。</p>
    <form method="post" action="https://wishlite-academy.zeabur.app/api/pay/create">
      <input type="hidden" name="sku" value="L1S">
      <label>Email（⚠️ 請填你 LINE 帳號綁定的 Email）</label>
      <input name="email" type="email" required placeholder="你的 LINE 綁定 Email">
      <button type="submit">前往藍新付款（NT$3,980）→</button>
    </form>
    <p class="warn">測試完成後由管理者於藍新後台取消授權，不會實際請款。<br>
    不確定 LINE 綁定哪個 Email？打開 LINE App → 設定 → 帳號 → 電子郵件帳號。</p>
  </div>
</body>
</html>
