<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>找到你的命定小多肉｜韻手作 Wishlite</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --moss: #3d5a3e;
  --moss-dark: #2e4630;
  --sage: #7a9e7e;
  --cream: #f5f0e8;
  --sand: #e8dcc8;
  --soft: #f9f6f0;
  --gold: #c49a3c;
  --gold-light: #d4b06a;
  --mist: #d4e4d0;
  --ink: #1e2a1e;
  --white: #ffffff;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  font-family: 'Noto Sans TC', sans-serif;
  background: linear-gradient(135deg, var(--soft) 0%, var(--cream) 100%);
  color: var(--ink);
  min-height: 100vh;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

/* Decorative background leaves */
body::before, body::after {
  content: '';
  position: fixed;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, var(--mist) 0%, transparent 70%);
  border-radius: 50%;
  opacity: 0.4;
  pointer-events: none;
  z-index: 0;
}
body::before { top: -100px; left: -100px; }
body::after { bottom: -100px; right: -100px; }

.container {
  max-width: 560px;
  width: 100%;
  background: var(--white);
  border-radius: 24px;
  box-shadow: 0 20px 60px rgba(61, 90, 62, 0.12);
  overflow: hidden;
  position: relative;
  z-index: 1;
}

.screen {
  padding: 48px 36px;
  display: none;
  animation: fadeIn 0.5s ease-out;
}
.screen.active { display: block; }

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ============ INTRO SCREEN ============ */
.brand-label {
  font-size: 11px;
  letter-spacing: 2.5px;
  color: var(--gold);
  text-transform: uppercase;
  text-align: center;
  margin-bottom: 16px;
  font-weight: 500;
}

.intro-title {
  font-family: 'Noto Serif TC', serif;
  font-size: 34px;
  font-weight: 700;
  color: var(--moss);
  text-align: center;
  margin-bottom: 18px;
  letter-spacing: 2px;
  line-height: 1.3;
}

.intro-subtitle {
  font-size: 15px;
  color: var(--sage);
  text-align: center;
  margin-bottom: 36px;
  line-height: 1.9;
  font-weight: 400;
}

.intro-cover {
  width: calc(100% + 72px);
  margin: 0 -36px 28px -36px;
  display: block;
  background: var(--soft);
  overflow: hidden;
}
.intro-cover img {
  width: 100%;
  height: auto;
  display: block;
}
.intro-cover-fallback {
  display: none;
  padding: 40px 20px;
  text-align: center;
  font-size: 48px;
  letter-spacing: 8px;
}

.intro-meta {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin-bottom: 32px;
  padding: 16px 0;
  border-top: 1px solid var(--cream);
  border-bottom: 1px solid var(--cream);
}
.intro-meta-item {
  text-align: center;
}
.intro-meta-num {
  font-family: 'Noto Serif TC', serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--moss);
}
.intro-meta-label {
  font-size: 11px;
  letter-spacing: 1.5px;
  color: var(--sage);
  text-transform: uppercase;
  margin-top: 4px;
}

/* ============ BUTTONS ============ */
.btn {
  display: block;
  width: 100%;
  padding: 16px 24px;
  background: var(--moss);
  color: var(--white);
  border: none;
  border-radius: 28px;
  font-family: inherit;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s ease;
  letter-spacing: 1px;
}
.btn:hover {
  background: var(--moss-dark);
  transform: translateY(-2px);
  box-shadow: 0 10px 24px rgba(61, 90, 62, 0.25);
}
.btn:active { transform: translateY(0); }

.btn-outline {
  background: var(--white);
  color: var(--moss);
  border: 1.5px solid var(--moss);
}
.btn-outline:hover {
  background: var(--moss);
  color: var(--white);
}

/* ============ QUESTION SCREEN ============ */
.progress-wrap {
  margin-bottom: 36px;
}
.progress {
  height: 4px;
  background: var(--mist);
  border-radius: 4px;
  overflow: hidden;
}
.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--moss) 0%, var(--sage) 100%);
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
  border-radius: 4px;
  width: 0%;
}

.q-number {
  font-size: 11px;
  letter-spacing: 2.5px;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 14px;
  font-weight: 500;
}

.question {
  font-family: 'Noto Serif TC', serif;
  font-size: 24px;
  font-weight: 500;
  color: var(--moss);
  margin-bottom: 32px;
  line-height: 1.5;
  letter-spacing: 1px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.option {
  padding: 18px 22px;
  background: var(--soft);
  border: 1.5px solid transparent;
  border-radius: 16px;
  cursor: pointer;
  text-align: left;
  font-family: inherit;
  font-size: 15px;
  color: var(--ink);
  transition: all 0.25s ease;
  line-height: 1.5;
  font-weight: 400;
  position: relative;
}
.option:hover {
  border-color: var(--sage);
  background: var(--mist);
  transform: translateX(4px);
  box-shadow: 0 4px 12px rgba(61, 90, 62, 0.08);
}
.option:active { transform: translateX(2px) scale(0.99); }

/* ============ RESULT SCREEN ============ */
.result-frame {
  background: linear-gradient(180deg, var(--mist) 0%, var(--soft) 100%);
  margin: -48px -36px 28px -36px;
  padding: 48px 36px 36px 36px;
  text-align: center;
  position: relative;
}
.result-frame::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 40px;
  height: 3px;
  background: var(--gold);
  border-radius: 3px;
}

.result-badge {
  font-size: 11px;
  letter-spacing: 3px;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 16px;
  font-weight: 500;
}

.result-emoji {
  font-size: 72px;
  margin-bottom: 12px;
  filter: drop-shadow(0 6px 12px rgba(61,90,62,0.15));
}
.result-photo {
  width: 160px;
  height: 160px;
  margin: 0 auto 16px;
  border-radius: 50%;
  overflow: hidden;
  background: var(--white);
  box-shadow: 0 10px 30px rgba(61,90,62,0.2);
  border: 4px solid var(--white);
}
.result-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.result-name {
  font-family: 'Noto Serif TC', serif;
  font-size: 32px;
  font-weight: 700;
  color: var(--moss-dark);
  margin-bottom: 8px;
  letter-spacing: 3px;
}

.result-tagline {
  font-size: 13px;
  color: var(--sage);
  font-style: italic;
  letter-spacing: 1px;
}

.result-section {
  margin-bottom: 24px;
}

.result-section-label {
  font-size: 10px;
  letter-spacing: 2.5px;
  color: var(--gold);
  text-transform: uppercase;
  margin-bottom: 10px;
  font-weight: 500;
}

.result-text {
  font-size: 15px;
  line-height: 1.9;
  color: var(--ink);
  letter-spacing: 0.3px;
}

.traits {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.trait-tag {
  padding: 6px 14px;
  background: var(--cream);
  color: var(--moss);
  border-radius: 16px;
  font-size: 13px;
  font-weight: 500;
}

.match-card {
  background: var(--soft);
  padding: 18px 20px;
  border-radius: 16px;
  border-left: 3px solid var(--gold);
}

.match-label {
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--gold);
  font-weight: 500;
  margin-bottom: 6px;
  text-transform: uppercase;
}

.match-name {
  font-family: 'Noto Serif TC', serif;
  font-size: 16px;
  color: var(--moss);
  font-weight: 500;
  line-height: 1.5;
}

/* ============ CTA CARD ============ */
.cta-card {
  background: var(--white);
  border-radius: 20px;
  padding: 24px 22px;
  margin-bottom: 16px;
  box-shadow: 0 6px 24px rgba(61, 90, 62, 0.08);
  border: 1px solid var(--cream);
}
.cta-card-title {
  font-family: 'Noto Serif TC', serif;
  font-size: 16px;
  color: var(--moss-dark);
  font-weight: 500;
  margin-bottom: 18px;
  letter-spacing: 1.5px;
  text-align: center;
}
.cta-card-title .leaf {
  display: inline-block;
  margin-left: 4px;
}

.btn-line {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 16px 20px;
  background: #06C755;
  color: var(--white);
  border: none;
  border-radius: 14px;
  font-family: inherit;
  font-size: 16px;
  font-weight: 700;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.3s ease;
  letter-spacing: 2px;
  margin-bottom: 10px;
}
.btn-line:hover {
  background: #05B14C;
  transform: translateY(-2px);
  box-shadow: 0 10px 24px rgba(6, 199, 85, 0.25);
}

.btn-secondary {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 100%;
  padding: 16px 20px;
  background: var(--white);
  color: var(--moss);
  border: 1.5px solid var(--moss);
  border-radius: 14px;
  font-family: inherit;
  font-size: 16px;
  font-weight: 500;
  text-decoration: none;
  cursor: pointer;
  transition: all 0.3s ease;
  letter-spacing: 2px;
}
.btn-secondary:hover {
  background: var(--moss);
  color: var(--white);
  transform: translateY(-2px);
  box-shadow: 0 10px 24px rgba(61, 90, 62, 0.18);
}

.btn-restart {
  display: block;
  width: 100%;
  padding: 16px 20px;
  background: var(--white);
  color: var(--moss);
  border: 1.5px solid var(--sage);
  border-radius: 14px;
  font-family: 'Noto Serif TC', serif;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.3s ease;
  letter-spacing: 4px;
  margin-bottom: 24px;
}
.btn-restart:hover {
  background: var(--soft);
  border-color: var(--moss);
}

/* ============ FOOTER ============ */
.footer {
  text-align: center;
  padding-top: 8px;
}
.footer-dots {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-bottom: 14px;
}
.footer-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--mist);
}
.footer-text {
  font-size: 12px;
  letter-spacing: 2px;
  color: var(--sage);
  font-weight: 400;
}
.footer-text strong {
  color: var(--moss);
  font-weight: 500;
  letter-spacing: 2.5px;
}

.share-link {
  display: block;
  text-align: center;
  margin-top: 12px;
  font-size: 12px;
  color: var(--sage);
  text-decoration: none;
  letter-spacing: 1px;
  cursor: pointer;
  transition: color 0.2s;
}
.share-link:hover { color: var(--moss); text-decoration: underline; }

/* ============ MOBILE ============ */
@media (max-width: 480px) {
  body { padding: 12px; }
  .screen { padding: 36px 24px; }
  .intro-title { font-size: 28px; }
  .intro-subtitle { font-size: 14px; }
  .question { font-size: 20px; }
  .result-frame { margin: -36px -24px 24px -24px; padding: 36px 24px 28px; }
  .result-name { font-size: 26px; }
  .result-emoji { font-size: 60px; }
  .option { padding: 16px 18px; font-size: 14px; }
  .action-row { flex-direction: column; }
}
</style>
</head>

<div class="container">

    <div class="footer">

</div>

// ============ LOGIC ============
let currentQ = 0;
let scores = {};

function startQuiz() {
  scores = {};
  Object.keys(succulents).forEach(k => scores[k] = 0);
  currentQ = 0;
  showScreen('screen-question');
  renderQuestion();
}

function renderQuestion() {
  const q = questions[currentQ];
  document.getElementById('q-number').textContent = `QUESTION ${currentQ + 1} / ${questions.length}`;
  document.getElementById('q-text').textContent = q.q;
  document.getElementById('progress').style.width = `${((currentQ) / questions.length) * 100}%`;

  const optsDiv = document.getElementById('q-options');
  optsDiv.innerHTML = '';
  q.options.forEach((opt) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt.text;
    btn.onclick = () => selectOption(opt);
    optsDiv.appendChild(btn);
  });
}

function selectOption(opt) {
  opt.score.forEach(s => scores[s] = (scores[s] || 0) + 1);
  currentQ++;
  if (currentQ >= questions.length) {
    document.getElementById('progress').style.width = '100%';
    setTimeout(showResult, 400);
  } else {
    renderQuestion();
  }
}

function showResult() {
  // Find highest scoring succulent
  let topKey = Object.keys(scores).reduce((a, b) =>
    scores[a] > scores[b] ? a : b
  );
  const s = succulents[topKey];

  document.getElementById('r-emoji').textContent = s.emoji;
  const photoEl = document.getElementById('r-photo');
  const photoWrap = document.getElementById('r-photo-wrap');
  const emojiEl = document.getElementById('r-emoji');
  photoWrap.style.display = 'block';
  emojiEl.style.display = 'none';
  photoEl.src = s.image;
  photoEl.alt = s.name;
  document.getElementById('r-name').textContent = s.name;
  document.getElementById('r-tagline').textContent = s.tagline;
  document.getElementById('r-desc').textContent = s.desc;

  const traitsDiv = document.getElementById('r-traits');
  traitsDiv.innerHTML = '';
  s.traits.forEach(t => {
    const tag = document.createElement('span');
    tag.className = 'trait-tag';
    tag.textContent = t;
    traitsDiv.appendChild(tag);
  });

  document.getElementById('r-match').textContent = s.match;

  showScreen('screen-result');
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function restart() {
  showScreen('screen-intro');
}

function share() {
  const name = document.getElementById('r-name').textContent;
  const tagline = document.getElementById('r-tagline').textContent;
  const text = `我的命定多肉是「${name}」${tagline.split('·')[1] || ''}！\n來測測你的吧 🌱\n\n韻手作 Wishlite LINE：@728zvmqz\n#韻手作Wishlite #多肉人格測驗 #永續行動`;

  if (navigator.share) {
    navigator.share({
      title: '韻手作多肉人格測驗',
      text: text
    }).catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      alert('已複製分享文字，可以貼到 IG / FB / LINE！');
    });
  } else {
    alert(text);
  }
}
